approvedGitRepositories:
  - "*"

enableScripts: true

enableTelemetry: false

nodeLinker: node-modules

# Koa uses content-disposition 1.x; its declarations must not resolve the
# unrelated 2.x native types hoisted by other consumers.
packageExtensions:
  "@types/koa@3.0.3":
    dependencies:
      content-disposition: "~1.0.1"

npmMinimalAgeGate: 0

npmPublishAccess: public

preferInteractive: true

preferReuse: true

tsEnableAutoTypes: true
